<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Triage{% endblock %}</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght,SOFT@9..144,600;9..144,700;9..144,800&family=Geist:wght@300;400;500;600;700&family=Geist+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/static/style.css">
  <script src="https://unpkg.com/htmx.org@2.0.4"></script>
</head>
<body>
{% block body %}{% endblock %}
<script>
  function autosize(el) {
    el.style.height = 'auto';
    el.style.height = (el.scrollHeight + 2) + 'px';
  }
  function autosizeAll() {
    document.querySelectorAll('.composer-input').forEach(autosize);
  }
  document.addEventListener('input', (e) => {
    if (e.target.classList.contains('composer-input')) {
      autosize(e.target);
      const send = e.target.closest('.composer-frame')?.querySelector('.composer-send');
      if (send) send.disabled = !e.target.value.trim();
    }
    if (e.target.classList.contains('rail-search')) {
      const q = e.target.value.trim().toLowerCase();
      document.querySelectorAll('.rail-item').forEach(el => {
        const bugId = (el.dataset.bugId || '').toLowerCase();
        const title = (el.querySelector('.rail-title')?.textContent || '').toLowerCase();
        const match = !q || bugId.includes(q) || title.includes(q);
        el.parentElement.style.display = match ? '' : 'none';
      });
    }
  });
  // Keyboard shortcuts for power users.
  // Ignored when any input/textarea is focused so typing isn't hijacked.
  document.addEventListener('keydown', (e) => {
    const tag = (document.activeElement?.tagName || '').toLowerCase();
    if (e.metaKey || e.ctrlKey || e.altKey) return;
    if (['input', 'textarea', 'select'].includes(tag) && e.key !== 'Escape') return;
    const clickIfActive = sel => {
      const btn = document.querySelector(sel);
      if (btn && !btn.disabled) { btn.click(); e.preventDefault(); }
    };
    switch (e.key) {
      case 'ArrowDown':
      case 'j':
        clickIfActive('.deck-next');
        break;
      case 'ArrowUp':
      case 'k':
        clickIfActive('.deck-prev');
        break;
      case '/':
        {
          const search = document.querySelector('.rail-search');
          if (search) { search.focus(); search.select(); e.preventDefault(); }
        }
        break;
      case 'a':
        clickIfActive('.deck-stage .btn-primary, .deck-stage .btn-reassign');
        break;
      case 's':
        clickIfActive('.deck-stage .btn-ghost');
        break;
      case 'Escape':
        if (document.activeElement && 'blur' in document.activeElement) {
          document.activeElement.blur();
        }
        break;
    }
  });
  // Move active state instantly on tab click so the UI feels responsive
  // even before the htmx response arrives.
  document.addEventListener('click', (e) => {
    const tab = e.target.closest('.tab');
    if (!tab) return;
    document.querySelectorAll('.tab').forEach(t => {
      t.classList.remove('tab--active');
      t.setAttribute('aria-selected', 'false');
    });
    tab.classList.add('tab--active');
    tab.setAttribute('aria-selected', 'true');
  });
  autosizeAll();
  document.addEventListener('htmx:afterSettle', autosizeAll);
  if (document.fonts && document.fonts.ready) {
    document.fonts.ready.then(autosizeAll);
  }

  // After a bug-click htmx swap, only the deck swaps — the rail stays
  // mounted. Sync the rail's active-item highlight from the URL.
  document.addEventListener('htmx:afterSwap', () => {
    const params = new URLSearchParams(window.location.search);
    const activeBug = params.get('bug');
    if (!activeBug) return;   // tab switch — rail was freshly rendered
    document.querySelectorAll('.rail-item').forEach(el => {
      el.classList.toggle('is-active', el.dataset.bugId === activeBug);
    });
  });

  // SSE: re-fetch the current tab content when the dashboard's data
  // directory changes (e.g. terminal /triage writes a new pending JSON,
  // /process-queue revises a draft, or anything else touches the files).
  (function () {
    if (typeof EventSource === 'undefined' || typeof htmx === 'undefined') return;
    const es = new EventSource('/events');
    const refresh = () => {
      const url = window.location.pathname + window.location.search;
      htmx.ajax('GET', url, { target: '#tab-content', swap: 'innerHTML' });
    };
    ['draft-changed', 'draft-deleted', 'watch-changed'].forEach((evt) => {
      es.addEventListener(evt, refresh);
    });
    // queue-changed: just update the topbar button's count, no full refresh.
    es.addEventListener('queue-changed', async () => {
      try {
        const r = await fetch('/queue/count');
        const { count } = await r.json();
        const btn = document.getElementById('btn-process-queue');
        if (!btn) return;
        btn.querySelector('.queue-count').textContent = count;
        btn.disabled = count === 0;
      } catch (_) { /* ignore */ }
    });
  })();

  async function processQueue(btn) {
    if (!btn || btn.disabled) return;
    const original = btn.textContent;
    btn.disabled = true;
    btn.textContent = 'Preparing…';
    try {
      const r = await fetch('/queue/prepare', { method: 'POST' });
      const data = await r.json();
      if (!r.ok || !data.prompt) {
        btn.textContent = 'Nothing to drain';
        setTimeout(() => { btn.textContent = original; btn.disabled = false; }, 1500);
        return;
      }
      const dialog = document.getElementById('queue-prompt-dialog');
      const textarea = document.getElementById('queue-prompt-text');
      textarea.value = data.prompt;
      try { await navigator.clipboard.writeText(data.prompt); } catch (_) {}
      dialog.showModal();
      textarea.focus();
      textarea.select();
    } catch (e) {
      btn.textContent = 'Failed';
      setTimeout(() => { btn.textContent = original; }, 1500);
    } finally {
      btn.disabled = false;
      btn.querySelector('.queue-count') || (btn.textContent = original);
    }
  }
  document.addEventListener('click', async (e) => {
    if (e.target.id === 'queue-prompt-copy') {
      const t = document.getElementById('queue-prompt-text');
      try { await navigator.clipboard.writeText(t.value); e.target.textContent = 'Copied'; } catch (_) {}
    } else if (e.target.id === 'queue-prompt-close') {
      document.getElementById('queue-prompt-dialog').close();
    }
  });
</script>
</body>
</html>
