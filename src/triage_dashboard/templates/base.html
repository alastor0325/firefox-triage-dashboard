<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Triage{% endblock %}</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght,SOFT@9..144,600;9..144,700;9..144,800&family=Geist:wght@300;400;500;600;700&family=Geist+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
{% block body %}{% endblock %}
<script>
  // Auto-fit comment textareas to their content so there's no trailing empty space.
  (function () {
    function autosize(el) {
      el.style.height = 'auto';
      el.style.height = (el.scrollHeight + 2) + 'px';
    }
    const els = document.querySelectorAll('.card-comment');
    els.forEach(el => {
      autosize(el);
      el.addEventListener('input', () => autosize(el));
    });
    // Re-run after fonts load so the height matches the final layout.
    if (document.fonts && document.fonts.ready) {
      document.fonts.ready.then(() => els.forEach(autosize));
    }
  })();
</script>
</body>
</html>
