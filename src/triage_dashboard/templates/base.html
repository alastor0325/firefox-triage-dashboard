<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Triage{% endblock %}</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght,SOFT@9..144,600;9..144,700;9..144,800&family=Geist:wght@300;400;500;600;700&family=Geist+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/static/style.css?v={{ css_version }}">
  <script src="https://unpkg.com/htmx.org@2.0.4"></script>
</head>
<body>
{% block body %}{% endblock %}
<script>
  function autosize(el) {
    el.style.height = 'auto';
    el.style.height = (el.scrollHeight + 2) + 'px';
  }
  function autosizeAll() {
    document.querySelectorAll('.composer-input').forEach(autosize);
  }
  document.addEventListener('input', (e) => {
    if (e.target.classList.contains('composer-input')) {
      autosize(e.target);
      const send = e.target.closest('.composer-frame')?.querySelector('.composer-send');
      if (send) send.disabled = !e.target.value.trim();
    }
    if (e.target.classList.contains('rail-search')) {
      const q = e.target.value.trim().toLowerCase();
      document.querySelectorAll('.rail-item').forEach(el => {
        const bugId = (el.dataset.bugId || '').toLowerCase();
        const title = (el.querySelector('.rail-title')?.textContent || '').toLowerCase();
        const match = !q || bugId.includes(q) || title.includes(q);
        el.parentElement.style.display = match ? '' : 'none';
      });
    }
  });
  // Keyboard shortcuts for power users.
  // Ignored when any input/textarea is focused so typing isn't hijacked.
  document.addEventListener('keydown', (e) => {
    const tag = (document.activeElement?.tagName || '').toLowerCase();
    if (e.metaKey || e.ctrlKey || e.altKey) return;
    if (['input', 'textarea', 'select'].includes(tag) && e.key !== 'Escape') return;
    const clickIfActive = sel => {
      const btn = document.querySelector(sel);
      if (btn && !btn.disabled) { btn.click(); e.preventDefault(); }
    };
    switch (e.key) {
      case 'ArrowDown':
      case 'j':
        clickIfActive('.deck-next');
        break;
      case 'ArrowUp':
      case 'k':
        clickIfActive('.deck-prev');
        break;
      case 'ArrowLeft':
      case 'ArrowRight': {
        // Switch to prev/next topbar tab. No wrap at edges.
        const tabs = Array.from(document.querySelectorAll('.tab'));
        const idx = tabs.findIndex(t => t.classList.contains('tab--active'));
        if (idx < 0) break;
        const target = e.key === 'ArrowLeft' ? idx - 1 : idx + 1;
        if (target >= 0 && target < tabs.length) {
          tabs[target].click();
          e.preventDefault();
        }
        break;
      }
      case '/':
        {
          const search = document.querySelector('.rail-search');
          if (search) { search.focus(); search.select(); e.preventDefault(); }
        }
        break;
      case 'a':
        clickIfActive('.deck-stage .btn-primary, .deck-stage .btn-reassign');
        break;
      case 'Escape':
        if (document.activeElement && 'blur' in document.activeElement) {
          document.activeElement.blur();
        }
        break;
    }
  });
  // Move active state instantly on tab click so the UI feels responsive
  // even before the htmx response arrives.
  document.addEventListener('click', (e) => {
    const tab = e.target.closest('.tab');
    if (!tab) return;
    document.querySelectorAll('.tab').forEach(t => {
      t.classList.remove('tab--active');
      t.setAttribute('aria-selected', 'false');
    });
    tab.classList.add('tab--active');
    tab.setAttribute('aria-selected', 'true');
  });
  autosizeAll();
  document.addEventListener('htmx:afterSettle', autosizeAll);
  if (document.fonts && document.fonts.ready) {
    document.fonts.ready.then(autosizeAll);
  }

  // After an htmx swap (tab click, rail click, queue-dropdown row click),
  // only #tab-content / #deck-area changes — the topbar tabs aren't
  // re-rendered. Sync the active tab indicator and the rail highlight
  // from the URL so the chrome reflects where we just landed.
  document.addEventListener('htmx:afterSwap', () => {
    const params = new URLSearchParams(window.location.search);
    const activeTab = params.get('tab');
    if (activeTab) {
      document.querySelectorAll('.tab').forEach(t => {
        const slug = new URL(t.href, window.location.origin).searchParams.get('tab');
        const isActive = slug === activeTab;
        t.classList.toggle('tab--active', isActive);
        t.setAttribute('aria-selected', isActive ? 'true' : 'false');
      });
    }
    const activeBug = params.get('bug');
    if (!activeBug) return;
    document.querySelectorAll('.rail-item').forEach(el => {
      el.classList.toggle('is-active', el.dataset.bugId === activeBug);
    });
  });

  // Snappy tab indicator update when clicking a queue-dropdown row,
  // before the htmx response arrives. (The afterSwap handler above is
  // the source of truth; this just removes the perceived lag.)
  document.addEventListener('click', (e) => {
    const jump = e.target.closest('.queue-dropdown-jump');
    if (!jump || !jump.dataset.targetTab) return;
    const slug = jump.dataset.targetTab;
    document.querySelectorAll('.tab').forEach(t => {
      const tSlug = new URL(t.href, window.location.origin).searchParams.get('tab');
      const isActive = tSlug === slug;
      t.classList.toggle('tab--active', isActive);
      t.setAttribute('aria-selected', isActive ? 'true' : 'false');
    });
  });

  // SSE: re-fetch the current tab content when the dashboard's data
  // directory changes (e.g. terminal /triage writes a new pending JSON,
  // a Claude session drains the queue, or anything else touches the files).
  (function () {
    if (typeof EventSource === 'undefined' || typeof htmx === 'undefined') return;
    const es = new EventSource('/events');
    const refresh = () => {
      const url = window.location.pathname + window.location.search;
      htmx.ajax('GET', url, { target: '#tab-content', swap: 'innerHTML' });
    };
    ['draft-changed', 'draft-deleted', 'watch-changed'].forEach((evt) => {
      es.addEventListener(evt, refresh);
    });
    // queue-changed: just update the topbar button's count, no full refresh.
    es.addEventListener('queue-changed', async () => {
      try {
        // Refresh the topbar count span.
        const r = await fetch('/queue/count');
        const { count } = await r.json();
        const span = document.querySelector('#btn-process-queue .queue-count');
        if (span) span.textContent = count;
        // Refresh the dropdown contents so the open dropdown stays in
        // sync with the JSONL (e.g. external append/remove or a drain
        // truncating the file).
        const panel = document.getElementById('queue-dropdown-panel');
        if (panel) {
          htmx.ajax('GET', '/queue/dropdown', {
            target: '#queue-dropdown-panel', swap: 'innerHTML',
          });
        }
      } catch (_) { /* ignore */ }
    });
  })();

  // Explicit copy from the Process queue dropdown.
  async function copyDrainPrompt(btn) {
    if (!btn || btn.disabled) return;
    const original = btn.textContent;
    btn.disabled = true;
    btn.textContent = 'Copying…';
    try {
      const r = await fetch('/queue/prepare', { method: 'POST' });
      const data = await r.json();
      if (!r.ok || !data.prompt) {
        btn.textContent = 'Nothing to drain';
        setTimeout(() => { btn.textContent = original; btn.disabled = false; }, 1500);
        return;
      }
      await navigator.clipboard.writeText(data.prompt);
      btn.textContent = 'Copied · paste into Claude';
      setTimeout(() => { btn.textContent = original; btn.disabled = false; }, 2000);
    } catch (e) {
      btn.textContent = 'Failed';
      setTimeout(() => { btn.textContent = original; btn.disabled = false; }, 1500);
    }
  }

  // Close the Process queue dropdown when clicking outside it.
  document.addEventListener('click', (e) => {
    const dropdown = document.getElementById('process-queue-dropdown');
    if (!dropdown || !dropdown.open) return;
    if (!dropdown.contains(e.target)) {
      dropdown.open = false;
    }
  });
</script>
</body>
</html>
