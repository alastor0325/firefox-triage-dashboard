{% extends "base.html" %}
{% block title %}Bug {{ bug_id }} · Investigation{% endblock %}
{% block body %}
<header class="topbar">
  <div class="brand">
    <h1 class="brand-title"><a href="/">Triage</a></h1>
    <span class="brand-sub">Bug <strong>{{ bug_id }}</strong> · Investigation</span>
  </div>
  <div class="topbar-right">
    <a class="investigation-bz"
       href="https://bugzilla.mozilla.org/show_bug.cgi?id={{ bug_id }}"
       target="_blank" rel="noopener">Open in Bugzilla&nbsp;↗</a>
  </div>
</header>

<main class="investigation-main">
  <a class="investigation-back" href="/">←&nbsp;Back to triage</a>
  {% include "_investigation_content.html" %}
</main>
{% endblock %}
